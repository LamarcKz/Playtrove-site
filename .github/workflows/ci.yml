name: Site checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      # Fixtures keep pull requests independent of the live GitHub API.
      - name: Build with release fixtures
        run: npm run build:test

      - name: Install the headless browser
        run: npx playwright install --with-deps chromium

      - name: Check the built site without captures
        run: npm run test:site
