name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep an active Pages deployment running; newer requests share this queue.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test


      # The build reads the app's published releases and generates the posts.
      # Nothing is committed back to either repository.
      - name: Build the public site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install the headless browser
        run: npx playwright install --with-deps chromium

      - name: Check the built site without captures
        run: npm run test:site
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v5
